openapi: 3.1.0
info:
  title: core-service API (v1)
  version: "1.0.0"
  description: |
    Channels, threads, messages, reactions, participants, user-state, inbox, and thread lifecycle.
    **Org scoping**: All resources are scoped by organization. The service uses **JWT-based org scoping**:
    `org_id` (and `user_id`) are taken from the validated JWT; there is no `orgId` path parameter.
    Clients send `Authorization: Bearer <access_token>`; the token must contain `org_id`, `user_id`, and `membership_id`.
servers:
  - url: https://core.example.com
paths:
  /health:
    get:
      summary: Liveness check
      tags: [Health]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthLive" }
  /health/ready:
    get:
      summary: Readiness check (DB connectivity)
      tags: [Health]
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReady" }
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                required: [statusCode, message]
                properties:
                  statusCode: { type: integer, example: 503 }
                  message: { $ref: "#/components/schemas/HealthReady" }
                  error: { type: string, example: "Service Unavailable" }

  /channels:
    post:
      summary: Create channel
      tags: [Channels]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChannelRequest" }
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    get:
      summary: List channels
      tags: [Channels]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Channels (org from JWT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelsListResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }

  /threads:
    post:
      summary: Create thread in channel
      tags: [Threads]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateThreadRequest" }
      responses:
        "201":
          description: Thread created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /threads/channel/{channelId}:
    get:
      summary: List threads in channel
      tags: [Threads]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Threads in channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadsListResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /threads/{threadId}/state:
    post:
      summary: Transition thread state (explicit command)
      tags: [Threads]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateThreadStateRequest" }
      responses:
        "200":
          description: Thread updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /threads/{threadId}/participants:
    post:
      summary: Add participant to thread
      tags: [Participants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddParticipantRequest" }
      responses:
        "201":
          description: Participant added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    get:
      summary: List participants in thread
      tags: [Participants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantsListResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /threads/{threadId}/participants/{userId}:
    patch:
      summary: Update participant (role, muted_until)
      tags: [Participants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateParticipantRequest" }
      responses:
        "200":
          description: Participant updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      summary: Remove participant from thread
      tags: [Participants]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Participant removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemovedResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /threads/{threadId}/user-state:
    get:
      summary: Get current user's thread workflow state (get-or-create)
      tags: [User State]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: User state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStateResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      summary: Update current user's thread workflow state
      tags: [User State]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateThreadUserStateRequest" }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStateResponse" }
        "400":
          description: Invalid (e.g. status=SNOOZED but snoozed_until missing)
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /inbox:
    get:
      summary: Get per-user async inbox (review queue)
      description: |
        Returns server-ordered inbox items for the current user. Org and user come from JWT.
        Only threads with user_state.status = IN_INBOX are included.
        Ordering: priority_override (HIGH before NONE/LOW), needs_response, last_activity_at desc.
        unread_count uses the user's last_read_message_id when set: count of messages in the thread with createdAt after that message; otherwise total message count in the thread.
      tags: [Inbox]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque cursor from previous response next_cursor to fetch the next page.
      responses:
        "200":
          description: Inbox items and optional next_cursor when more results exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }

  /messages:
    post:
      summary: Create message in thread (immutable)
      description: |
        Creates a new immutable message and its initial version (version=1).
        Supports kind (TEXT/SYSTEM), format (PLAIN/MARKDOWN), reply_to_message_id, metadata_json.
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMessageRequest" }
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /messages/thread/{threadId}:
    get:
      summary: List messages in thread
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Messages with latest version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagesListResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /messages/{messageId}/versions:
    post:
      summary: Create a new message version (edit)
      description: Edits are append-only; version increments (1,2,3...).
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMessageVersionRequest" }
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageVersionResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    get:
      summary: List versions of a message
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Versions (newest first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageVersionsListResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /reactions:
    post:
      summary: Toggle reaction on message
      description: Adds the reaction if absent; removes it if present. Idempotent per (message_id, emoji, user).
      tags: [Reactions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToggleReactionRequest" }
      responses:
        "200":
          description: Toggle result (action: added | removed) and reaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToggleReactionResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /reactions/message/{messageId}:
    get:
      summary: List reactions on message
      tags: [Reactions]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Reactions grouped by emoji with count and whether current user reacted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReactionsListResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
      description: Optional idempotency key for safely retrying POSTs.
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }

    ChannelVisibility:
      type: string
      enum: [ORG, PRIVATE]
    CreateChannelRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, minLength: 2, maxLength: 60, pattern: "^[a-z0-9-]+$" }
        visibility:
          allOf:
            - $ref: "#/components/schemas/ChannelVisibility"
          default: ORG
        description: { type: string, nullable: true, maxLength: 500 }
    Channel:
      type: object
      required: [id, org_id, name, slug, visibility, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        visibility: { $ref: "#/components/schemas/ChannelVisibility" }
        created_at: { type: string, format: date-time }
    ChannelResponse:
      type: object
      required: [channel]
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
    ChannelsListResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }

    ThreadState:
      type: string
      enum: [OPEN, BLOCKED, DECIDED, ARCHIVED]
    CreateThreadRequest:
      type: object
      required: [channel_id, title]
      properties:
        channel_id: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 200 }
        purpose: { type: string, nullable: true, maxLength: 2000 }
    Thread:
      type: object
      required: [id, org_id, channel_id, title, state, created_at, last_activity_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        title: { type: string }
        purpose: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/ThreadState" }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    ThreadResponse:
      type: object
      required: [thread]
      properties:
        thread: { $ref: "#/components/schemas/Thread" }
    ThreadsListResponse:
      type: object
      required: [threads]
      properties:
        threads:
          type: array
          items: { $ref: "#/components/schemas/Thread" }
    UpdateThreadStateRequest:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/ThreadState" }

    ThreadParticipantRole:
      type: string
      enum: [OWNER, PARTICIPANT, OBSERVER]
    ThreadParticipant:
      type: object
      required: [id, org_id, thread_id, user_id, role, joined_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        thread_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/ThreadParticipantRole" }
        joined_at: { type: string, format: date-time }
        left_at: { type: string, format: date-time, nullable: true }
        muted_until: { type: string, format: date-time, nullable: true }
    AddParticipantRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/ThreadParticipantRole" }
    UpdateParticipantRequest:
      type: object
      properties:
        role: { $ref: "#/components/schemas/ThreadParticipantRole" }
        muted_until: { type: string, format: date-time, nullable: true }
    ParticipantResponse:
      type: object
      required: [participant]
      properties:
        participant: { $ref: "#/components/schemas/ThreadParticipant" }
    ParticipantsListResponse:
      type: object
      required: [participants]
      properties:
        participants:
          type: array
          items: { $ref: "#/components/schemas/ThreadParticipant" }
    RemovedResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [removed] }

    ThreadUserStatus:
      type: string
      enum: [IN_INBOX, ARCHIVED, SNOOZED]
    PriorityOverride:
      type: string
      enum: [NONE, LOW, HIGH]
    ThreadUserState:
      type: object
      required: [id, org_id, thread_id, user_id, status, needs_response, priority_override, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        thread_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ThreadUserStatus" }
        needs_response: { type: boolean }
        snoozed_until: { type: string, format: date-time, nullable: true }
        last_read_message_id: { type: string, format: uuid, nullable: true }
        last_reviewed_at: { type: string, format: date-time, nullable: true }
        priority_override: { $ref: "#/components/schemas/PriorityOverride" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpdateThreadUserStateRequest:
      type: object
      properties:
        status: { $ref: "#/components/schemas/ThreadUserStatus" }
        needs_response: { type: boolean }
        snoozed_until: { type: string, format: date-time, nullable: true }
        last_read_message_id: { type: string, format: uuid, nullable: true }
        last_reviewed_at: { type: string, format: date-time, nullable: true }
        priority_override: { $ref: "#/components/schemas/PriorityOverride" }
      description: If status=SNOOZED, snoozed_until is required (400 otherwise).
    UserStateResponse:
      type: object
      required: [user_state]
      properties:
        user_state: { $ref: "#/components/schemas/ThreadUserState" }

    InboxNextAction:
      type: string
      enum: [REVIEW, RESPOND, WAIT, NONE]
    InboxItem:
      type: object
      description: Flat inbox item (one per thread in inbox).
      required: [thread_id, thread_title, thread_state, thread_last_activity_at, user_status, needs_response, has_urgent_unread, unread_count, next_action, priority_override, sort_key]
      properties:
        thread_id: { type: string, format: uuid }
        thread_title: { type: string }
        thread_purpose: { type: string, nullable: true }
        thread_state: { type: string }
        thread_last_activity_at: { type: string, format: date-time }
        user_status: { $ref: "#/components/schemas/ThreadUserStatus" }
        needs_response: { type: boolean }
        has_urgent_unread: { type: boolean, description: True when thread has URGENT messages and unread_count > 0. }
        unread_count: { type: integer, minimum: 0, description: When user_state.last_read_message_id is set, count of messages in thread with createdAt after that message; otherwise total messages in thread. }
        latest_message_preview: { type: string, nullable: true }
        next_action: { $ref: "#/components/schemas/InboxNextAction" }
        priority_override: { $ref: "#/components/schemas/PriorityOverride" }
        sort_key: { type: string, description: Opaque server-defined ordering key. }
    InboxResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InboxItem" }
        next_cursor:
          type: string
          nullable: true
          description: Present when more results exist; pass as cursor on the next request.

    MessageKind:
      type: string
      enum: [TEXT, SYSTEM]
    MessageFormat:
      type: string
      enum: [PLAIN, MARKDOWN]
    Urgency:
      type: string
      enum: [NORMAL, URGENT]
    CreateMessageRequest:
      type: object
      required: [thread_id, body]
      properties:
        thread_id: { type: string, format: uuid }
        body: { type: string, minLength: 1, maxLength: 20000 }
        kind: { $ref: "#/components/schemas/MessageKind" }
        urgency: { $ref: "#/components/schemas/Urgency" }
        requires_response: { type: boolean, default: false }
        reply_to_message_id: { type: string, format: uuid, nullable: true }
        metadata_json: { type: object, additionalProperties: true }
    Message:
      type: object
      required: [id, org_id, thread_id, author_user_id, kind, urgency, requires_response, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        thread_id: { type: string, format: uuid }
        author_user_id: { type: string, format: uuid }
        author_membership_id: { type: string, format: uuid, nullable: true }
        kind: { $ref: "#/components/schemas/MessageKind" }
        urgency: { $ref: "#/components/schemas/Urgency" }
        requires_response: { type: boolean }
        created_at: { type: string, format: date-time }
        reply_to_message_id: { type: string, format: uuid, nullable: true }
        metadata_json: { type: object, additionalProperties: true }
    MessageVersion:
      type: object
      required: [id, message_id, version, body, format, created_at]
      properties:
        id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        body: { type: string }
        format: { $ref: "#/components/schemas/MessageFormat" }
        created_at: { type: string, format: date-time }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: object
          required: [id, org_id, thread_id, author_user_id, kind, urgency, requires_response, created_at]
          properties:
            id: { type: string, format: uuid }
            org_id: { type: string, format: uuid }
            thread_id: { type: string, format: uuid }
            author_user_id: { type: string, format: uuid }
            author_membership_id: { type: string, format: uuid, nullable: true }
            kind: { $ref: "#/components/schemas/MessageKind" }
            urgency: { $ref: "#/components/schemas/Urgency" }
            requires_response: { type: boolean }
            created_at: { type: string, format: date-time }
            latest_version:
              type: object
              nullable: true
              properties:
                id: { type: string, format: uuid }
                version: { type: integer }
                body: { type: string }
                format: { $ref: "#/components/schemas/MessageFormat" }
                created_at: { type: string, format: date-time }
    MessagesListResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              org_id: { type: string, format: uuid }
              thread_id: { type: string, format: uuid }
              author_user_id: { type: string, format: uuid }
              author_membership_id: { type: string, format: uuid, nullable: true }
              kind: { $ref: "#/components/schemas/MessageKind" }
              urgency: { $ref: "#/components/schemas/Urgency" }
              requires_response: { type: boolean }
              created_at: { type: string, format: date-time }
              latest_version: { $ref: "#/components/schemas/MessageVersion" }
    CreateMessageVersionRequest:
      type: object
      required: [body]
