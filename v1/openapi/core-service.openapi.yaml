openapi: 3.1.0
info:
  title: core-service API (v1)
  version: "1.0.0"
  description: |
    Channels, threads, messages, reactions, async workflow state, and thread lifecycle.
servers:
  - url: https://core.example.com
paths:
  /orgs/{orgId}/channels:
    post:
      summary: Create channel
      tags: [Channels]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChannelRequest" }
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    get:
      summary: List channels
      tags: [Channels]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paged channels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedChannels" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /orgs/{orgId}/channels/{channelId}/threads:
    post:
      summary: Create thread in channel
      tags: [Threads]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateThreadRequest" }
      responses:
        "201":
          description: Thread created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /orgs/{orgId}/threads/{threadId}:
    get:
      summary: Get thread (metadata + participants)
      tags: [Threads]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadWithParticipants" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /orgs/{orgId}/threads/{threadId}/messages:
    post:
      summary: Create message in thread (immutable)
      description: |
        Creates a new immutable message and its initial version (`version=1`).
        Messages are **async-first** by default; `urgency=URGENT` is explicit and auditable.
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMessageRequest" }
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageWithLatestVersion" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /orgs/{orgId}/messages/{messageId}/versions:
    post:
      summary: Create a new message version (edit)
      description: Edits are append-only; the original message is not overwritten.
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMessageVersionRequest" }
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageVersion" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /orgs/{orgId}/threads/{threadId}/state:
    post:
      summary: Transition thread state (explicit command)
      tags: [Threads]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadStateCommand" }
      responses:
        "200":
          description: Thread updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /orgs/{orgId}/inbox:
    get:
      summary: Get per-user async inbox (review queue)
      description: |
        Returns server-ordered inbox items. Ordering is not defined as "latest reply first".
      tags: [Inbox]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - name: include_archived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Paged inbox items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedInbox" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /orgs/{orgId}/threads/{threadId}/user-state:
    patch:
      summary: Update per-user thread workflow state
      tags: [Inbox]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateThreadUserStateRequest" }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadUserState" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        description: Opaque cursor for pagination.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: |
        Optional idempotency key for safely retrying POSTs (recommended for clients).
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
    ChannelVisibility:
      type: string
      enum: [ORG, PRIVATE]
    ThreadState:
      type: string
      enum: [OPEN, BLOCKED, DECIDED, ARCHIVED]
    Urgency:
      type: string
      enum: [NORMAL, URGENT]
    MessageKind:
      type: string
      enum: [TEXT, SYSTEM]
    MessageFormat:
      type: string
      enum: [PLAIN, MARKDOWN]
    ThreadParticipantRole:
      type: string
      enum: [OWNER, PARTICIPANT, OBSERVER]
    ThreadUserStatus:
      type: string
      enum: [IN_INBOX, ARCHIVED, SNOOZED]
    PriorityOverride:
      type: string
      enum: [NONE, LOW, HIGH]
    CreateChannelRequest:
      type: object
      required: [name, visibility]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, nullable: true, maxLength: 500 }
        visibility: { $ref: "#/components/schemas/ChannelVisibility" }
    Channel:
      type: object
      required: [id, org_id, name, visibility, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        visibility: { $ref: "#/components/schemas/ChannelVisibility" }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    PagedChannels:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
        next_cursor: { type: string, nullable: true }
    CreateThreadRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 140 }
        purpose: { type: string, nullable: true, maxLength: 1000 }
        participant_user_ids:
          type: array
          description: Optional explicit participants (in addition to creator).
          items: { type: string, format: uuid }
        initial_message:
          nullable: true
          description: Optional first message created alongside the thread.
          $ref: "#/components/schemas/CreateMessageRequest"
    Thread:
      type: object
      required: [id, org_id, channel_id, title, state, created_by, created_at, updated_at, last_activity_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        title: { type: string }
        purpose: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/ThreadState" }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    ThreadParticipant:
      type: object
      required: [id, org_id, thread_id, user_id, role, joined_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        thread_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/ThreadParticipantRole" }
        joined_at: { type: string, format: date-time }
        left_at: { type: string, format: date-time, nullable: true }
        muted_until: { type: string, format: date-time, nullable: true }
    ThreadWithParticipants:
      type: object
      required: [thread, participants]
      properties:
        thread: { $ref: "#/components/schemas/Thread" }
        participants:
          type: array
          items: { $ref: "#/components/schemas/ThreadParticipant" }
    CreateMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 20000 }
        format: { $ref: "#/components/schemas/MessageFormat" }
        urgency: { $ref: "#/components/schemas/Urgency" }
        requires_response: { type: boolean, default: false }
        reply_to_message_id: { type: string, format: uuid, nullable: true }
        metadata_json:
          type: object
          additionalProperties: true
          default: {}
    Message:
      type: object
      required: [id, org_id, thread_id, author_id, created_at, kind, urgency, requires_response]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        thread_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        kind: { $ref: "#/components/schemas/MessageKind" }
        urgency: { $ref: "#/components/schemas/Urgency" }
        requires_response: { type: boolean }
        reply_to_message_id: { type: string, format: uuid, nullable: true }
        metadata_json: { type: object, additionalProperties: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        deleted_by: { type: string, format: uuid, nullable: true }
    MessageVersion:
      type: object
      required: [id, org_id, message_id, version, body, format, created_at, created_by]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        body: { type: string }
        format: { $ref: "#/components/schemas/MessageFormat" }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
    MessageWithLatestVersion:
      type: object
      required: [message, latest_version]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        latest_version: { $ref: "#/components/schemas/MessageVersion" }
    CreateMessageVersionRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 20000 }
        format: { $ref: "#/components/schemas/MessageFormat" }
    ThreadStateCommand:
      type: object
      required: [to_state, reason]
      properties:
        to_state: { $ref: "#/components/schemas/ThreadState" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ThreadUserState:
      type: object
      required: [id, org_id, thread_id, user_id, status, needs_response, priority_override, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        thread_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ThreadUserStatus" }
        needs_response: { type: boolean }
        snoozed_until: { type: string, format: date-time, nullable: true }
        last_read_message_id: { type: string, format: uuid, nullable: true }
        last_reviewed_at: { type: string, format: date-time, nullable: true }
        priority_override: { $ref: "#/components/schemas/PriorityOverride" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpdateThreadUserStateRequest:
      type: object
      properties:
        status: { $ref: "#/components/schemas/ThreadUserStatus" }
        needs_response: { type: boolean }
        snoozed_until: { type: string, format: date-time, nullable: true }
        last_read_message_id: { type: string, format: uuid, nullable: true }
        last_reviewed_at: { type: string, format: date-time, nullable: true }
        priority_override: { $ref: "#/components/schemas/PriorityOverride" }
    InboxNextAction:
      type: string
      enum: [REVIEW, RESPOND, WAIT, NONE]
    InboxThread:
      type: object
      required: [thread, user_state, unread_count, has_urgent_unread, next_action, sort_key]
      properties:
        thread: { $ref: "#/components/schemas/Thread" }
        user_state: { $ref: "#/components/schemas/ThreadUserState" }
        unread_count: { type: integer, minimum: 0 }
        latest_message_preview: { type: string, nullable: true }
        has_urgent_unread: { type: boolean }
        next_action: { $ref: "#/components/schemas/InboxNextAction" }
        sort_key:
          type: string
          description: Opaque server-defined ordering key (stable for paging).
    PagedInbox:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InboxThread" }
        next_cursor: { type: string, nullable: true }
