openapi: 3.1.0
info:
  title: identity-service API (v1)
  version: "1.0.0"
  description: |
    Authentication, users, organizations, memberships, invites, roles/permissions, audit logs, health.
    **JWT claims** (access token): `sub` (user_id), `org_id`, `membership_id`, `role_id` (optional), `perms` (string[]), `jti` (optional).
    **Rate limiting**: `/auth/login` 5/60s, `/auth/refresh` 30/60s, `/auth/password-reset/request` 5/60s, `/orgs/{orgId}/invites/accept` 5/60s.
servers:
  - url: https://identity.example.com
paths:
  /health:
    get:
      summary: Liveness check
      tags: [Health]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthLive" }
  /health/ready:
    get:
      summary: Readiness check (DB connectivity)
      tags: [Health]
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReady" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReady" }
  /auth/login:
    post:
      summary: Login (org-scoped)
      description: |
        Authenticates a user and returns an **org-scoped** access token (JWT) plus refresh token.
        v1 requires selecting the org via `org_slug` to avoid ambiguous multi-org sessions.
        **Rate limited:** 5 requests per 60 seconds.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/refresh:
    post:
      summary: Refresh access token (rotate refresh token)
      description: **Rate limited:** 30 requests per 60 seconds. Implements refresh token rotation + reuse detection.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/logout:
    post:
      summary: Logout (revoke refresh token)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/logout-all:
    post:
      summary: Revoke all refresh tokens for current user in current org
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All tokens revoked
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/password-reset/request:
    post:
      summary: Request password reset (placeholder)
      description: Always returns 202 to avoid user enumeration. **Rate limited:** 5/60s.
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202":
          description: Accepted
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /auth/password-reset/confirm:
    post:
      summary: Confirm password reset (placeholder)
      description: Returns 501 Not Implemented.
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "200":
          description: Reset complete (when implemented)
        "501":
          description: Not implemented
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /me:
    get:
      summary: Get current user + active membership
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /orgs:
    post:
      summary: Create organization
      description: |
        Creates an organization and adds the caller as an `ORG_ADMIN` member.
        (Signup flows can be layered on top later.)
      tags: [Organizations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgWithMembership"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /orgs/{orgId}:
    get:
      summary: Get organization
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /orgs/{orgId}/members:
    post:
      summary: Invite/add member
      tags: [Memberships]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /orgs/{orgId}/members/{memberId}:
    patch:
      summary: Update member (role/status)
      tags: [Memberships]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /orgs/{orgId}/invites:
    post:
      summary: Create invite (org admin only)
      tags: [Invites]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Invite created; token returned once (deliver out-of-band)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateInviteResponse" }
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    get:
      summary: List invites for org (org admin only)
      tags: [Invites]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Invites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitesListResponse" }
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /orgs/{orgId}/invites/revoke:
    post:
      summary: Revoke an invite (org admin only)
      tags: [Invites]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeInviteRequest" }
      responses:
        "204":
          description: Invite revoked
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /orgs/{orgId}/invites/verify:
    post:
      summary: Verify invite token (public, no auth)
      description: Returns org + invite details; does not leak token hash.
      tags: [Invites]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyInviteRequest" }
      responses:
        "200":
          description: Invite valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyInviteResponse" }
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /orgs/{orgId}/invites/accept:
    post:
      summary: Accept invite (public)
      description: Creates user if needed or validates password; returns access + refresh tokens. **Rate limited:** 5/60s.
      tags: [Invites]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: Session created (same shape as /auth/login)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /orgs/{orgId}/invites/decline:
    post:
      summary: Decline invite (public, no auth)
      tags: [Invites]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeclineInviteRequest" }
      responses:
        "204":
          description: Invite declined
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /orgs/{orgId}/audit:
    get:
      summary: List audit log entries
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Filter by action code prefix or exact match.
      responses:
        "200":
          description: Paged audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAuditLog"
        "403":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque cursor for pagination (audit uses numeric offset; null if end).
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
    LoginRequest:
      type: object
      required: [email, password, org_slug]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        org_slug:
          type: string
          description: Organization slug to scope the session.
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        org_slug: { type: string, pattern: "^[a-z0-9-]+$" }
    PasswordResetConfirm:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8 }
    HealthLive:
      type: object
      required: [status, ts]
      properties:
        status: { type: string, enum: [ok] }
        ts: { type: string, format: date-time }
    HealthReady:
      type: object
      required: [status, ts]
      properties:
        status: { type: string, enum: [ok, error] }
        db: { type: string, enum: [ok, down], nullable: true }
        latency_ms: { type: integer, nullable: true }
        ts: { type: string, format: date-time }
    AuthSession:
      type: object
      required: [access_token, refresh_token, user, membership, org]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/User" }
        membership: { $ref: "#/components/schemas/Membership" }
        org: { $ref: "#/components/schemas/Organization" }
    MeResponse:
      type: object
      required: [user, membership, org]
      properties:
        user: { $ref: "#/components/schemas/User" }
        membership: { $ref: "#/components/schemas/Membership" }
        org: { $ref: "#/components/schemas/Organization" }
    CreateOrgRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        slug:
          type: string
          minLength: 3
          maxLength: 60
          pattern: "^[a-z0-9-]+$"
    OrgWithMembership:
      type: object
      required: [org, membership]
      properties:
        org: { $ref: "#/components/schemas/Organization" }
        membership: { $ref: "#/components/schemas/Membership" }
    CreateMemberRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role_id: { type: string, format: uuid, nullable: true }
    UpdateMemberRequest:
      type: object
      properties:
        role_id: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, LEFT]
    Organization:
      type: object
      required: [id, name, slug, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DELETED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
    User:
      type: object
      required: [id, email, display_name, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DELETED] }
        email_verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
    Membership:
      type: object
      required: [id, org_id, user_id, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [ACTIVE, INVITED, SUSPENDED, LEFT] }
        joined_at: { type: string, format: date-time, nullable: true }
        invited_by_user_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditLog:
      type: object
      required: [id, org_id, action, target_type, metadata_json, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid, nullable: true }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string, format: uuid, nullable: true }
        metadata_json: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    PagedAuditLog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditLog" }
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page (null if end).
    CreateInviteRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role_id: { type: string, format: uuid, nullable: true }
    CreateInviteResponse:
      type: object
      required: [invite, token]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        token: { type: string, description: "One-time token; deliver out-of-band." }
    Invite:
      type: object
      required: [id, org_id, email, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role_id: { type: string, format: uuid, nullable: true }
        invited_by_user_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        declined_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
    InvitesListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invite" }
    RevokeInviteRequest:
      type: object
      required: [invite_id]
      properties:
        invite_id: { type: string, format: uuid }
    VerifyInviteRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    VerifyInviteResponse:
      type: object
      required: [org, invite]
      properties:
        org:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        invite: { $ref: "#/components/schemas/Invite" }
    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
    DeclineInviteRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
